<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc">
  <title id="title">Torn PDA setup overview for NWA Target Finder</title>
  <desc id="desc">Open Settings and Advanced Browser Settings, enable custom user scripts, open Manage Scripts and tap plus. Name the script NWA Target Finder, paste the complete source code, choose END injection, then tap Add, enable the script and reload Torn.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { fill: #f3f6f5; font-size: 25px; font-weight: 700; }
      .card-title { fill: #f3f6f5; font-size: 17px; font-weight: 700; }
      .body { fill: #d4ddd9; font-size: 15px; }
      .small { fill: #a8b7b0; font-size: 13px; }
      .green { fill: #79df9a; font-size: 14px; font-weight: 700; }
      .field { fill: #101713; stroke: #41574a; }
    </style>
  </defs>
  <rect width="640" height="890" rx="16" fill="#101713"/>
  <text x="24" y="41" class="heading">Torn PDA · setup overview</text>
  <text x="24" y="67" class="body">Install NWA Target Finder by copying the complete script.</text>

  <g transform="translate(24 94) scale(1.25)">
    <rect width="216" height="284" rx="12" fill="#1b2620" stroke="#344b3d"/>
    <circle cx="27" cy="29" r="15" fill="#79df9a"/>
    <text x="27" y="35" text-anchor="middle" fill="#102316" font-size="17" font-weight="700">1</text>
    <text x="51" y="35" class="card-title">Enable scripts</text>
    <text x="18" y="78" class="body">Settings</text>
    <path d="M26 90v15m-5-5 5 5 5-5" fill="none" stroke="#79df9a" stroke-width="2"/>
    <text x="18" y="131" class="body">Advanced Browser</text>
    <text x="18" y="151" class="body">Settings</text>
    <rect x="14" y="175" width="188" height="79" rx="8" class="field"/>
    <text x="25" y="198" class="body">Enable custom</text>
    <text x="25" y="217" class="body">user scripts</text>
    <rect x="152" y="228" width="37" height="17" rx="8.5" fill="#79df9a"/>
    <circle cx="180" cy="236.5" r="6.5" fill="#102316"/>
    <text x="25" y="241" class="green">ON</text>
  </g>

  <g transform="translate(346 94) scale(1.25)">
    <rect width="216" height="284" rx="12" fill="#1b2620" stroke="#344b3d"/>
    <circle cx="27" cy="29" r="15" fill="#79df9a"/>
    <text x="27" y="35" text-anchor="middle" fill="#102316" font-size="17" font-weight="700">2</text>
    <text x="51" y="35" class="card-title">Add a script</text>
    <rect x="14" y="65" width="188" height="47" rx="8" class="field"/>
    <text x="27" y="94" class="body">Manage Scripts</text>
    <text x="182" y="94" text-anchor="middle" fill="#79df9a" font-size="24">›</text>
    <text x="18" y="145" class="body">Open the script list,</text>
    <text x="18" y="166" class="body">then tap the plus.</text>
    <circle cx="108" cy="220" r="28" fill="#79df9a"/>
    <path d="M108 207v26m-13-13h26" fill="none" stroke="#102316" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(24 474) scale(1.25)">
    <rect width="216" height="284" rx="12" fill="#1b2620" stroke="#344b3d"/>
    <circle cx="27" cy="29" r="15" fill="#79df9a"/>
    <text x="27" y="35" text-anchor="middle" fill="#102316" font-size="17" font-weight="700">3</text>
    <text x="51" y="35" class="card-title">Paste the code</text>
    <text x="18" y="77" class="small">Script name</text>
    <rect x="14" y="87" width="188" height="37" rx="6" class="field"/>
    <text x="24" y="111" class="body">NWA Target Finder</text>
    <text x="18" y="151" class="small">Paste source code</text>
    <rect x="14" y="161" width="188" height="65" rx="6" class="field"/>
    <text x="24" y="184" class="body">Paste the full .user.js</text>
    <text x="24" y="205" class="body">file, including its header.</text>
    <text x="18" y="255" class="body">Injection:</text>
    <text x="90" y="255" class="green">END</text>
  </g>

  <g transform="translate(346 474) scale(1.25)">
    <rect width="216" height="284" rx="12" fill="#1b2620" stroke="#344b3d"/>
    <circle cx="27" cy="29" r="15" fill="#79df9a"/>
    <text x="27" y="35" text-anchor="middle" fill="#102316" font-size="17" font-weight="700">4</text>
    <text x="51" y="35" class="card-title">Save and reload</text>
    <rect x="48" y="69" width="120" height="40" rx="8" fill="#79df9a"/>
    <text x="108" y="95" text-anchor="middle" fill="#102316" font-size="16" font-weight="700">Add</text>
    <text x="18" y="143" class="body">Enable the new script.</text>
    <text x="18" y="176" class="body">Reload Torn inside PDA.</text>
    <text x="18" y="209" class="body">Tap the NWA gear</text>
    <text x="18" y="230" class="body">to sign in with your</text>
    <text x="18" y="251" class="body">Limited Torn API key.</text>
  </g>

  <text x="24" y="864" class="small">Illustrated steps; app layout may vary.</text>
  <text x="616" y="864" text-anchor="end" class="green">North West Alliance</text>
</svg>
